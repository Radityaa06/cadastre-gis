<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DharNav — Cadastral Digital Twin & Drone AI Intelligence</title>
    <meta name="description" content="DharNav transforms cadastral mapping into an interactive spatial digital twin with AI self-verification loops, real-time what-if construction simulations, drone orthomosaic parcel boundary extraction, and live GPS Google Maps navigation." />
    <meta property="og:title" content="DharNav — Cadastral Digital Twin & Drone AI Intelligence" />
    <meta property="og:description" content="DharNav transforms cadastral mapping into an interactive spatial digital twin with AI self-verification loops, real-time what-if construction simulations, drone orthomosaic parcel boundary extraction, and live GPS Google Maps navigation." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  </head>
  <body class="bg-slate-50 text-slate-900 font-sans antialiased selection:bg-indigo-500 selection:text-white">
    <div id="root">
      <div class="app-loader" role="status" aria-live="polite">
        <div class="app-loader-mark">D</div>
        <div class="app-loader-title">DharNav</div>
        <div class="app-loader-subtitle">Cadastral GIS Intelligence</div>
        <div class="app-loader-track"><span></span></div>
        <div class="app-loader-status">Initializing spatial workspace...</div>
      </div>
    </div>
    <style>
      .app-loader{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;background:linear-gradient(145deg,#f8fafc,#eef2ff);color:#0f172a;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
      .app-loader-mark{width:64px;height:64px;border-radius:20px;display:grid;place-items:center;background:#4f46e5;color:#fff;font-size:30px;font-weight:900;box-shadow:0 16px 35px rgba(79,70,229,.25);animation:loader-pulse 1.8s ease-in-out infinite}
      .app-loader-title{margin-top:20px;font-size:24px;font-weight:900;letter-spacing:-.04em}
      .app-loader-subtitle{margin-top:4px;color:#64748b;font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase}
      .app-loader-track{width:180px;height:4px;margin-top:28px;overflow:hidden;border-radius:999px;background:#c7d2fe}
      .app-loader-track span{display:block;width:45%;height:100%;border-radius:inherit;background:#4f46e5;animation:loader-slide 1.1s ease-in-out infinite}
      .app-loader-status{margin-top:12px;color:#94a3b8;font:500 11px/1.4 "JetBrains Mono",monospace}
      @keyframes loader-slide{0%{transform:translateX(-110%)}100%{transform:translateX(400%)}}
      @keyframes loader-pulse{50%{transform:translateY(-3px);box-shadow:0 20px 40px rgba(79,70,229,.32)}}
      @media (prefers-reduced-motion:reduce){.app-loader-mark,.app-loader-track span{animation:none}}
    </style>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
